<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NP予想システム</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        // --- Firebaseの設定 ---
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, update, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // 【重要】ここを自分のFirebaseの設定に書き換えてください！
        const firebaseConfig = {
            apiKey: "AIzaSyBZ0r2_JIJ1Ua4qjCKccoH3VJPIPCDkvDs",
            authDomain: "npgambling-bc6e5.firebaseapp.com",
            databaseURL: "npgambling-bc6e5",
            projectId: "npgambling-bc6e5.firebasestorage.app",
            storageBucket: "285005663209",
            messagingSenderId: "1:285005663209:web:7d06f232cb2aa7583f5978",
            appId: "G-W2S6NDP3CW"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- 状態管理 ---
        let currentUser = null;
        let gameState = {};
        let users = {};
        let votes = {};

        // --- 管理者パスワード ---
        const ADMIN_PASSWORD = "admin123"; // 好きなパスワードに変えてください

        // HTML要素
        const loginScreen = document.getElementById('login-screen');
        const mainScreen = document.getElementById('main-screen');
        const adminScreen = document.getElementById('admin-screen');

        // --- ログイン処理 ---
        window.login = () => {
            const name = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            if (!name || !pass) return alert("名前とパスワードを入れてね");

            if (users[name]) {
                if (users[name].password !== pass) return alert("パスワードが違うよ");
            } else {
                // 新規登録
                set(ref(db, 'users/' + name), {
                    password: pass,
                    points: 10000,
                    stars: 0,
                    totalWins: 0
                });
            }
            currentUser = name;
            loginScreen.classList.add('hidden');
            mainScreen.classList.remove('hidden');
            renderUI();
        };

        // --- 投票処理 ---
        window.placeBet = (optionIndex) => {
            if (gameState.status !== 'voting') return alert("今は投票期間じゃないよ");
            if (votes[currentUser]) return alert("もう投票済みだよ");

            const userPoints = users[currentUser].points;
            let amount = 0;

            if (userPoints <= 0) {
                // 救済モード
                amount = 0; 
            } else if (userPoints < 1000) {
                // 999以下は全額
                amount = userPoints;
                alert("所持金が1000未満なので全額ベットしたよ！");
            } else {
                amount = parseInt(document.getElementById('bet-amount').value);
                if (isNaN(amount) || amount < 1000) return alert("最低1000NPからだよ");
                if (amount > userPoints) return alert("そんなに持ってないよ");
            }

            set(ref(db, 'votes/' + currentUser), {
                optionIndex: optionIndex,
                amount: amount
            });

            // Discord通知（Webhookがあれば）
            sendDiscord(`${currentUser}さんが「${gameState.options[optionIndex]}」に賭けました！`);
        };

        // --- データベース同期 ---
        onValue(ref(db, '/'), (snapshot) => {
            const data = snapshot.val() || {};
            users = data.users || {};
            gameState = data.gameState || { status: 'idle', carryover: 0 };
            votes = data.votes || {};
            renderUI();
        });

        // --- UI表示 ---
        function renderUI() {
            if (!currentUser) return;
            
            // プロフィール更新
            const u = users[currentUser];
            document.getElementById('user-info').innerText = `${currentUser}様 | 貯金: ${u.points} NP | ★: ${u.stars}`;

            // ランキング更新
            const sortedUsers = Object.entries(users).sort((a,b) => b[1].points - a[1].points);
            document.getElementById('ranking').innerHTML = sortedUsers.map(([name, data]) => `
                <div class="flex justify-between border-b p-1 text-sm ${name === currentUser ? 'bg-yellow-100' : ''}">
                    <span>${data.stars > 0 ? '★'.repeat(data.stars) : ''} ${name}</span>
                    <span>${data.points.toLocaleString()} NP</span>
                </div>
            `).join('');

            // ゲーム画面更新
            const gameBox = document.getElementById('game-box');
            if (gameState.status === 'idle') {
                gameBox.innerHTML = "<p>次のお題を待ってね...</p>";
            } else {
                let html = `<h3 class="font-bold text-lg mb-2">【予想中】${gameState.title}</h3>`;
                html += `<p class="text-sm mb-4">現在の総額: ${(Object.values(votes).reduce((a, b) => a + b.amount, 0) + (gameState.carryover || 0)).toLocaleString()} NP (${Object.keys(votes).length}人が投票中)</p>`;
                
                if (u.points > 0) {
                    html += `<input type="number" id="bet-amount" class="border p-2 w-full mb-2" placeholder="賭ける額 (1000以上)">`;
                } else {
                    html += `<p class="text-red-500 font-bold mb-2">借金モード：当たれば復活、外せば借金！</p>`;
                }

                html += `<div class="grid grid-cols-2 gap-2">`;
                gameState.options.forEach((opt, idx) => {
                    const myVote = votes[currentUser];
                    const isSelected = myVote && myVote.optionIndex === idx;
                    html += `
                        <button onclick="placeBet(${idx})" ${myVote ? 'disabled' : ''} 
                            class="p-2 border rounded ${isSelected ? 'bg-blue-500 text-white' : 'bg-gray-100'}">
                            ${opt}
                        </button>`;
                });
                html += `</div>`;
                gameBox.innerHTML = html;
            }
        }

        // --- 管理者機能 ---
        window.showAdmin = () => {
            const p = prompt("管理者パスワードを入れてください");
            if (p === ADMIN_PASSWORD) adminScreen.classList.remove('hidden');
        };

        window.createGame = () => {
            const title = document.getElementById('new-title').value;
            const options = document.getElementById('new-options').value.split(',').map(s => s.trim());
            set(ref(db, 'gameState'), { status: 'voting', title, options, carryover: gameState.carryover || 0 });
            set(ref(db, 'votes'), {});
            sendDiscord(`🚀 予想開始！：${title}`);
        };

        window.resolveGame = (winningIndex) => {
            if (winningIndex === -1) { // ノーゲーム
                Object.entries(votes).forEach(([name, vote]) => {
                    update(ref(db, `users/${name}`), { points: users[name].points + vote.amount });
                });
                alert("全額返還しました");
            } else {
                const winners = Object.entries(votes).filter(([name, v]) => v.optionIndex === winningIndex);
                let totalPool = (gameState.carryover || 0) + Object.values(votes).reduce((a, b) => a + b.amount, 0);
                
                if (winners.length === 0) {
                    // キャリーオーバー
                    set(ref(db, 'gameState/carryover'), totalPool);
                    alert("正解者なし！キャリーオーバー発生！");
                } else {
                    // 配当計算
                    let winningPool = winners.reduce((sum, [name, v]) => sum + (users[name].points <= 0 ? 1000 : v.amount), 0);
                    
                    winners.forEach(([name, v]) => {
                        const effectiveAmount = users[name].points <= 0 ? 1000 : v.amount;
                        const share = Math.floor((effectiveAmount / winningPool) * totalPool);
                        const bonus = users[name].points <= 0 ? 1000 : 0;
                        update(ref(db, `users/${name}`), { points: users[name].points + share + bonus });
                    });
                    set(ref(db, 'gameState/carryover'), 0);
                }

                // ハズレた人の破産判定と借金
                Object.entries(votes).forEach(([name, v]) => {
                    if (v.optionIndex !== winningIndex) {
                        let newPoints = users[name].points - (users[name].points <= 0 ? 1000 : v.amount);
                        let newStars = users[name].stars;
                        if (users[name].points > 0 && newPoints <= 0) newStars++;
                        update(ref(db, `users/${name}`), { points: newPoints, stars: newStars });
                    }
                });
            }
            update(ref(db, 'gameState'), { status: 'idle' });
            set(ref(db, 'votes'), {});
        };

        async function sendDiscord(msg) {
            const url = document.getElementById('webhook-url').value;
            if (!url) return;
            await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ content: msg }) });
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen p-4 font-sans">

    <!-- ログイン画面 -->
    <div id="login-screen" class="max-w-md mx-auto bg-white p-8 rounded shadow-lg mt-10">
        <h1 class="text-2xl font-bold mb-4 text-center">NP予想システム</h1>
        <input type="text" id="username" placeholder="名前" class="w-full border p-2 mb-2">
        <input type="password" id="password" placeholder="復活の呪文" class="w-full border p-2 mb-4">
        <button onclick="login()" class="w-full bg-blue-500 text-white p-2 rounded">入室する</button>
    </div>

    <!-- メイン画面 -->
    <div id="main-screen" class="max-w-md mx-auto hidden">
        <div id="user-info" class="bg-blue-600 text-white p-3 rounded mb-4 shadow"></div>
        
        <div class="bg-white p-4 rounded shadow mb-4">
            <h2 class="font-bold border-b mb-2">現在の予想</h2>
            <div id="game-box"></div>
        </div>

        <div class="bg-white p-4 rounded shadow mb-4">
            <h2 class="font-bold border-b mb-2">ランキング</h2>
            <div id="ranking" class="max-h-40 overflow-y-auto"></div>
        </div>

        <button onclick="showAdmin()" class="text-xs text-gray-400">管理者モード</button>
    </div>

    <!-- 管理画面 -->
    <div id="admin-screen" class="max-w-md mx-auto hidden bg-red-50 p-4 border-2 border-red-200 rounded mt-4">
        <h2 class="font-bold mb-2">管理者メニュー</h2>
        <input type="text" id="webhook-url" placeholder="Discord Webhook URL" class="w-full text-xs p-1 mb-2 border">
        <div class="mb-4">
            <input type="text" id="new-title" placeholder="お題（例：犯人は誰？）" class="w-full p-2 mb-1">
            <input type="text" id="new-options" placeholder="選択肢をカンマ区切りで（例：A, B, C）" class="w-full p-2 mb-2">
            <button onclick="createGame()" class="bg-red-500 text-white p-2 w-full">予想を開始する</button>
        </div>
        <div id="admin-controls">
            <p class="text-sm mb-1">結果を確定させる：</p>
            <div class="grid grid-cols-2 gap-2">
                <button onclick="resolveGame(0)" class="bg-green-500 text-white p-1 text-sm rounded">選択肢1の勝ち</button>
                <button onclick="resolveGame(1)" class="bg-green-500 text-white p-1 text-sm rounded">選択肢2の勝ち</button>
                <button onclick="resolveGame(2)" class="bg-green-500 text-white p-1 text-sm rounded">選択肢3の勝ち</button>
                <button onclick="resolveGame(-1)" class="bg-gray-500 text-white p-1 text-sm rounded">ノーゲーム（返還）</button>
            </div>
        </div>
    </div>

</body>
</html>
